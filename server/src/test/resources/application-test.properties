# Test Profile Configuration
# Don't set spring.profiles.active in profile-specific files

# Disable Firebase auto-configuration for tests
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.firestore.GcpFirestoreAutoConfiguration

# Test Database Configuration
spring.test.database.replace=none

# Logging for tests
logging.level.com.basick.app=DEBUG
logging.level.org.springframework.test=DEBUG

# Firestore Emulator Configuration
google.cloud.firestore.project-id=test-project
google.cloud.firestore.emulator.host=localhost:8080

# Disable Firebase initialization warnings
logging.level.com.google.firebase=WARN
